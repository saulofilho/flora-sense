<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="16" y1="52" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="38" y1="28" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Bluetooth / IoT subtle signal arcs -->
  <path d="M 44 14 A 20 20 0 0 1 54 26" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0 1" opacity="0.7"/>
  <path d="M 40 18 A 14 14 0 0 1 48 27" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0 1" opacity="0.9"/>

  <!-- Plant Stem & Main Leaf -->
  <path d="M 20 50 C 22 36 28 26 44 18 C 44 32 36 46 22 50 Z" fill="url(#leafGrad)"/>
  <path d="M 22 48 C 26 38 32 28 42 20" stroke="#064e3b" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Left Secondary Leaflet -->
  <path d="M 24 38 C 16 36 12 30 14 24 C 20 24 24 30 25 36" fill="#34d399" opacity="0.9"/>

  <!-- Water Droplet -->
  <path d="M 42 30 C 42 30 48 37 48 41 C 48 44.3 45.3 47 42 47 C 38.7 47 36 44.3 36 41 C 36 37 42 30 42 30 Z" fill="url(#dropGrad)"/>
  <circle cx="40.5" cy="39" r="1.5" fill="#e0f2fe" opacity="0.8"/>

  <!-- Soil line / Pot base accent -->
  <path d="M 16 52 Q 32 54 48 52" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
</svg>
